name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
            exe: .exe
          - name: linux-x64
            # oldest supported Ubuntu keeps the AppImage / .deb compatible with more distros
            os: ubuntu-22.04
            bundles: deb,appimage
            exe: ""
          - name: macos-arm64
            os: macos-latest
            bundles: app,dmg
            exe: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Test core (real links in temp folders)
        run: cargo test -p smart-symlink-core

      - name: Build terminal version
        run: cargo build --release -p smart-symlink-tui

      - name: Build GUI and installers
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp "target/release/smart-symlink-tui${{ matrix.exe }}" "out/smart-symlink-tui-${{ matrix.name }}${{ matrix.exe }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # portable exe (no installer needed, uses the WebView2 that ships with Windows 10/11)
            cp target/release/smart-symlink.exe "out/smart-symlink-portable-${{ matrix.name }}.exe"
            cp target/release/bundle/nsis/*.exe out/
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage out/
          else
            cp target/release/bundle/dmg/*.dmg out/
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: smart-symlink-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Smart Symlink ${{ github.ref_name }}" \
            --generate-notes --draft
