[package]
name = "dirlinker-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.12.0"
reflink-copy = "0.1.32"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["disk"] }
trash = "5.3.0"

[target."cfg(windows)".dependencies]
junction = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(unix)".dependencies]
filetime = "0.2.29"
libc = "0.2.191"
xattr = "1.7.0"
